<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Validador de Entradas</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background: #111;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      text-align: center;

      padding: 20px;

    }


    .contenedor {

      width: 100%;

      max-width: 500px;

      margin: auto;

    }


    h1 {

      font-size: 28px;

      margin:
        10px
        0
        5px;

    }


    .subtitulo {

      color: #aaa;

      margin-bottom: 20px;

    }


    #lector {

      width: 100%;

      max-width: 450px;

      margin: 20px auto;

      border-radius: 15px;

      overflow: hidden;

      background: #222;

    }


    button {

      width: 100%;

      max-width: 450px;

      padding: 16px;

      margin-top: 12px;

      border: none;

      border-radius: 10px;

      background: white;

      color: #111;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    button:active {

      transform:
        scale(0.98);

    }


    .secundario {

      background: #333;

      color: white;

    }


    #resultado {

      width: 100%;

      max-width: 450px;

      min-height: 110px;

      margin: 20px auto;

      padding: 20px;

      border-radius: 15px;

      background: #222;

      display: flex;

      align-items: center;

      justify-content: center;

      white-space: pre-line;

      font-size: 18px;

      font-weight: bold;

    }


    .instruccion {

      color: #888;

      font-size: 14px;

      margin-top: 15px;

    }


    .separador {

      color: #666;

      margin: 18px 0;

    }


    #archivoQR {

      display: none;

    }

  </style>

</head>


<body>


<div class="contenedor">


  <h1>
    🎟️ Validador de Entradas
  </h1>


  <div class="subtitulo">

    Escanea el código QR de la entrada

  </div>


  <!-- ========================================= -->
  <!-- LECTOR QR -->
  <!-- ========================================= -->

  <div id="lector"></div>


  <!-- ========================================= -->
  <!-- BOTÓN CÁMARA -->
  <!-- ========================================= -->

  <button
    onclick="iniciarCamara()"
  >

    📷 INICIAR ESCÁNER

  </button>


  <!-- ========================================= -->
  <!-- SUBIR IMAGEN -->
  <!-- ========================================= -->

  <div class="separador">

    ─────── O ───────

  </div>


  <button
    class="secundario"
    onclick="seleccionarImagen()"
  >

    🖼️ SUBIR IMAGEN DEL QR

  </button>


  <input
    type="file"
    id="archivoQR"
    accept="image/*"
    onchange="leerImagen(event)"
  >


  <!-- ========================================= -->
  <!-- RESULTADO -->
  <!-- ========================================= -->

  <div id="resultado">

    Esperando escaneo...

  </div>


  <div class="instruccion">

    Apunta la cámara al código QR
    o selecciona una imagen.

  </div>


</div>


<!-- ========================================= -->
<!-- LIBRERÍA QR -->
<!-- ========================================= -->

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<script>


// =====================================================
// CONFIGURACIÓN
// =====================================================

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbyRjE6hE21sTgXMjEI-ealn-_aX_MFiEfvxXr9JCJCAaRXcJkdYXArzgK_KvC5c1MFv/exec";


let escaner = null;

let procesando = false;

let camaraActiva = false;


// =====================================================
// ELEMENTO RESULTADO
// =====================================================

function resultado() {

  return document
    .getElementById("resultado");

}


// =====================================================
// MENSAJE
// =====================================================

function mensaje(texto) {

  resultado().innerText = texto;

}


// =====================================================
// INICIAR CÁMARA
// =====================================================

function iniciarCamara() {


  if (camaraActiva) {

    mensaje(
      "🟢 CÁMARA ACTIVA\n\n" +
      "Apunta al código QR."
    );

    return;

  }


  mensaje(
    "📷 ACTIVANDO CÁMARA..."
  );


  escaner =
    new Html5Qrcode(
      "lector"
    );


  const configuracion = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };


  // ==========================================
  // AQUÍ NO UTILIZAMOS facingMode
  // ==========================================

  Html5Qrcode
    .getCameras()

    .then(function(camaras) {


      if (
        !camaras ||
        camaras.length === 0
      ) {

        throw new Error(
          "No se encontró ninguna cámara."
        );

      }


      // Buscar cámara trasera

      let camara =
        camaras[0];


      for (
        let i = 0;
        i < camaras.length;
        i++
      ) {

        const nombre =
          (
            camaras[i].label || ""
          ).toLowerCase();


        if (

          nombre.includes("back") ||

          nombre.includes("rear") ||

          nombre.includes("trasera") ||

          nombre.includes("environment")

        ) {

          camara =
            camaras[i];

          break;

        }

      }


      return escaner.start(

        camara.id,

        configuracion,

        codigoDetectado,

        errorEscaneo

      );

    })


    .then(function() {

      camaraActiva = true;


      mensaje(
        "🟢 CÁMARA ACTIVA\n\n" +
        "Apunta al código QR."
      );

    })


    .catch(function(error) {

      camaraActiva = false;


      mensaje(
        "❌ NO SE PUDO ACCEDER A LA CÁMARA\n\n" +
        error
      );

    });

}


// =====================================================
// QR DETECTADO
// =====================================================

function codigoDetectado(codigo) {


  if (procesando) {

    return;

  }


  procesando = true;


  mensaje(
    "⏳ QR DETECTADO\n\n" +
    "VALIDANDO ENTRADA..."
  );


  detenerCamara();


  validarCodigo(codigo);

}


// =====================================================
// VALIDAR CÓDIGO
// =====================================================

function validarCodigo(codigo) {


  /*
   * Utilizamos un iframe oculto.
   *
   * Esto evita los problemas CORS
   * que pueden aparecer al utilizar
   * fetch directamente contra Apps Script.
   */


  const iframe =
    document.createElement("iframe");


  iframe.style.display =
    "none";


  const url =
    URL_APPS_SCRIPT +
    "?codigo=" +
    encodeURIComponent(codigo) +
    "&t=" +
    Date.now();


  iframe.src = url;


  document.body.appendChild(
    iframe
  );


  /*
   * Esperamos la respuesta
   * mediante el contenido de la página.
   */

  let intentos = 0;


  const intervalo =
    setInterval(function() {


      intentos++;


      try {

        const documento =
          iframe.contentDocument ||
          iframe.contentWindow.document;


        const texto =
          documento.body.innerText;


        if (
          texto &&
          texto.trim() !== ""
        ) {

          clearInterval(
            intervalo
          );


          iframe.remove();


          procesando = false;


          try {

            const datos =
              JSON.parse(texto);


            mostrarResultado(
              datos.resultado
            );

          }

          catch(error) {

            mostrarResultado(
              texto
            );

          }


          return;

        }

      }

      catch(error) {

        /*
         * El navegador puede bloquear
         * temporalmente el acceso al iframe.
         */

      }


      /*
       * Tiempo máximo de espera:
       * 15 segundos.
       */

      if (
        intentos >= 30
      ) {

        clearInterval(
          intervalo
        );


        iframe.remove();


        procesando = false;


        mensaje(
          "❌ NO SE RECIBIÓ RESPUESTA DEL SERVIDOR.\n\n" +
          "Intenta nuevamente."
        );

      }


    }, 500);

}


// =====================================================
// DETENER CÁMARA
// =====================================================

function detenerCamara() {


  if (!escaner) {

    camaraActiva = false;

    return;

  }


  escaner
    .stop()

    .then(function() {

      camaraActiva = false;

    })

    .catch(function() {

      camaraActiva = false;

    });

}


// =====================================================
// ERROR DE ESCANEO
// =====================================================

function errorEscaneo(error) {

  /*
   * No mostramos estos errores.
   *
   * html5-qrcode los genera constantemente
   * mientras busca un QR.
   */

}


// =====================================================
// SELECCIONAR IMAGEN
// =====================================================

function seleccionarImagen() {

  document
    .getElementById("archivoQR")
    .click();

}


// =====================================================
// LEER IMAGEN
// =====================================================

function leerImagen(event) {


  const archivo =
    event.target.files[0];


  if (!archivo) {

    return;

  }


  detenerCamara();


  mensaje(
    "🔍 ANALIZANDO IMAGEN...\n\n" +
    "Buscando código QR..."
  );


  const lectorImagen =
    new Html5Qrcode(
      "lector"
    );


  lectorImagen

    .scanFile(
      archivo,
      true
    )

    .then(function(codigo) {


      mensaje(
        "⏳ QR ENCONTRADO\n\n" +
        "VALIDANDO..."
      );


      validarCodigo(
        codigo
      );

    })


    .catch(function(error) {


      mensaje(

        "❌ NO SE ENCONTRÓ UN CÓDIGO QR\n\n" +

        "Asegúrate de que:\n" +

        "• El QR aparezca completo.\n" +

        "• La imagen tenga buena calidad.\n" +

        "• El QR esté enfocado."

      );

    });


  event.target.value = "";

}


// =====================================================
// MOSTRAR RESULTADO
// =====================================================

function mostrarResultado(texto) {


  const caja =
    resultado();


  caja.innerText =
    texto;


  // ==========================================
  // PERMITIDO
  // ==========================================

  if (

    texto.includes(
      "ACCESO PERMITIDO"
    )

  ) {

    caja.style.background =
      "#064e3b";

  }


  // ==========================================
  // BLOQUEADO
  // ==========================================

  else if (

    texto.includes(
      "YA UTILIZADA"
    ) ||

    texto.includes(
      "BLOQUEADA"
    ) ||

    texto.includes(
      "NO VÁLIDO"
    ) ||

    texto.includes(
      "FINALIZADO"
    ) ||

    texto.includes(
      "NO PERMITIDO"
    )

  ) {

    caja.style.background =
      "#7f1d1d";

  }


  else {

    caja.style.background =
      "#222";

  }

}


</script>


</body>

</html>
