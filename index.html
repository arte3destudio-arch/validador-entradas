<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Validador de Entradas</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;
      padding: 20px;

      min-height: 100vh;

      background: #111;
      color: white;

      font-family: Arial, Helvetica, sans-serif;

      text-align: center;

    }


    .contenedor {

      width: 100%;
      max-width: 500px;

      margin: auto;

    }


    h1 {

      margin: 10px 0 5px;

      font-size: 28px;

    }


    .subtitulo {

      color: #aaa;

      margin-bottom: 20px;

    }


    #lector {

      width: 100%;
      max-width: 450px;

      margin: 20px auto;

      border-radius: 15px;

      overflow: hidden;

      background: #222;

    }


    button {

      width: 100%;
      max-width: 450px;

      margin-top: 12px;

      padding: 16px;

      border: none;

      border-radius: 10px;

      background: white;

      color: #111;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    button:active {

      transform: scale(0.98);

    }


    .secundario {

      background: #333;

      color: white;

    }


    #resultado {

      width: 100%;
      max-width: 450px;

      min-height: 110px;

      margin: 20px auto;

      padding: 20px;

      border-radius: 15px;

      background: #222;

      display: flex;

      align-items: center;

      justify-content: center;

      white-space: pre-line;

      font-size: 18px;

      font-weight: bold;

    }


    .instruccion {

      color: #888;

      font-size: 14px;

      margin-top: 15px;

    }


    .separador {

      color: #666;

      margin: 18px 0;

    }


    #archivoQR {

      display: none;

    }

  </style>

</head>


<body>


  <div class="contenedor">


    <h1>
      🎟️ Validador de Entradas
    </h1>


    <div class="subtitulo">

      Escanea el código QR de la entrada

    </div>


    <!-- LECTOR -->

    <div id="lector"></div>


    <!-- CÁMARA -->

    <button
      id="botonCamara"
      onclick="iniciarCamara()"
    >

      📷 INICIAR ESCÁNER

    </button>


    <!-- SEPARADOR -->

    <div class="separador">

      ─────── O ───────

    </div>


    <!-- IMAGEN -->

    <button
      class="secundario"
      onclick="seleccionarImagen()"
    >

      🖼️ SUBIR IMAGEN DEL QR

    </button>


    <input
      type="file"
      id="archivoQR"
      accept="image/*"
      onchange="leerImagen(event)"
    >


    <!-- RESULTADO -->

    <div id="resultado">

      Esperando escaneo...

    </div>


    <div class="instruccion">

      Coloca el código QR dentro del recuadro
      o selecciona una imagen.

    </div>


  </div>


  <!-- ========================================= -->
  <!-- LIBRERÍA QR -->
  <!-- ========================================= -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <script>


    // =================================================
    // CONFIGURACIÓN
    // =================================================

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbyRjE6hE21sTgXMjEI-ealn-_aX_MFiEfvxXr9JCJCAaRXcJkdYXArzgK_KvC5c1MFv/exec";


    let escaner = null;

    let procesando = false;

    let camaraActiva = false;


    // =================================================
    // RESULTADO
    // =================================================

    function obtenerResultado() {

      return document.getElementById(
        "resultado"
      );

    }


    function mostrarMensaje(texto) {

      obtenerResultado().innerText =
        texto;

    }


    // =================================================
    // INICIAR CÁMARA
    // =================================================

    function iniciarCamara() {


      if (procesando) {

        return;

      }


      if (camaraActiva) {

        mostrarMensaje(

          "🟢 CÁMARA ACTIVA\n\n" +

          "Apunta al código QR."

        );

        return;

      }


      mostrarMensaje(

        "📷 PREPARANDO CÁMARA..."

      );


      // Limpiar lector anterior

      document.getElementById(
        "lector"
      ).innerHTML = "";


      escaner =
        new Html5Qrcode(
          "lector"
        );


      const configuracion = {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      };


      // =================================================
      // OBTENER CÁMARAS
      // =================================================

      Html5Qrcode
        .getCameras()

        .then(function(camaras) {


          if (
            !camaras ||
            camaras.length === 0
          ) {

            throw new Error(
              "No se encontró ninguna cámara."
            );

          }


          // ---------------------------------------------
          // Buscar cámara trasera
          // ---------------------------------------------

          let camaraSeleccionada =
            camaras[0];


          for (
            let i = 0;
            i < camaras.length;
            i++
          ) {

            const nombre =
              (
                camaras[i].label || ""
              ).toLowerCase();


            if (

              nombre.includes("back") ||

              nombre.includes("rear") ||

              nombre.includes("trasera") ||

              nombre.includes("environment")

            ) {

              camaraSeleccionada =
                camaras[i];

              break;

            }

          }


          // ---------------------------------------------
          // INICIAR CON ID DE CÁMARA
          // ---------------------------------------------

          return escaner.start(

            camaraSeleccionada.id,

            configuracion,

            codigoEscaneado,

            errorEscaneo

          );

        })


        .then(function() {


          camaraActiva = true;


          mostrarMensaje(

            "🟢 CÁMARA ACTIVA\n\n" +

            "Apunta al código QR."

          );

        })


        .catch(function(error) {


          camaraActiva = false;


          mostrarMensaje(

            "❌ NO SE PUDO ACCEDER A LA CÁMARA\n\n" +

            error

          );

        });

    }


    // =================================================
    // QR DETECTADO
    // =================================================

    function codigoEscaneado(codigo) {


      if (procesando) {

        return;

      }


      procesando = true;


      mostrarMensaje(

        "⏳ QR DETECTADO\n\n" +

        "VALIDANDO ENTRADA..."

      );


      detenerCamara();


      validarCodigo(codigo);

    }


    // =================================================
    // VALIDAR QR
    // =================================================

    function validarCodigo(codigo) {


      const url =

        URL_APPS_SCRIPT +

        "?codigo=" +

        encodeURIComponent(codigo) +

        "&t=" +

        Date.now();


      mostrarMensaje(

        "⏳ VALIDANDO ENTRADA...\n\n" +

        "Consultando servidor..."

      );


      /*
       * JSONP:
       *
       * Apps Script debe devolver la respuesta
       * mediante una función callback.
       */

      const nombreCallback =
        "respuestaQR_" +
        Date.now();


      window[nombreCallback] =
        function(respuesta) {


          try {


            if (
              respuesta &&
              respuesta.resultado
            ) {

              mostrarResultado(
                respuesta.resultado
              );

            }

            else {

              mostrarResultado(

                "❌ RESPUESTA NO VÁLIDA\n\n" +

                "El servidor no devolvió " +

                "un resultado."

              );

            }


          }

          catch(error) {

            mostrarResultado(

              "❌ ERROR AL PROCESAR RESPUESTA\n\n" +

              error.message

            );

          }


          procesando = false;


          // Eliminar callback

          try {

            delete window[
              nombreCallback
            ];

          }

          catch(error) {}

        };


      const script =
        document.createElement(
          "script"
        );


      script.src =

        url +

        "&callback=" +

        encodeURIComponent(
          nombreCallback
        );


      script.onerror =
        function() {


          mostrarResultado(

            "❌ ERROR DE CONEXIÓN\n\n" +

            "No se pudo comunicar " +

            "con Google Apps Script."

          );


          procesando = false;


          try {

            delete window[
              nombreCallback
            ];

          }

          catch(error) {}

        };


      document.body.appendChild(
        script
      );


      // ---------------------------------------------
      // Tiempo máximo
      // ---------------------------------------------

      setTimeout(
        function() {


          if (
            procesando &&
            window[
              nombreCallback
            ]
          ) {


            mostrarResultado(

              "❌ NO SE RECIBIÓ RESPUESTA DEL SERVIDOR.\n\n" +

              "Intenta nuevamente."

            );


            procesando = false;


            try {

              delete window[
                nombreCallback
              ];

            }

            catch(error) {}

          }


          if (
            script.parentNode
          ) {

            script.parentNode
              .removeChild(script);

          }


        },

        15000

      );

    }


    // =================================================
    // DETENER CÁMARA
    // =================================================

    function detenerCamara() {


      if (!escaner) {

        camaraActiva = false;

        return;

      }


      escaner
        .stop()

        .then(function() {

          camaraActiva = false;

        })

        .catch(function() {

          camaraActiva = false;

        });

    }


    // =================================================
    // SUBIR IMAGEN
    // =================================================

    function seleccionarImagen() {

      document
        .getElementById(
          "archivoQR"
        )
        .click();

    }


    // =================================================
    // LEER IMAGEN
    // =================================================

    function leerImagen(event) {


      const archivo =
        event.target.files[0];


      if (!archivo) {

        return;

      }


      detenerCamara();


      mostrarMensaje(

        "🔍 ANALIZANDO IMAGEN...\n\n" +

        "Buscando código QR..."

      );


      const lectorImagen =
        new Html5Qrcode(
          "lector"
        );


      lectorImagen

        .scanFile(
          archivo,
          true
        )

        .then(function(codigo) {


          mostrarMensaje(

            "⏳ QR ENCONTRADO\n\n" +

            "VALIDANDO ENTRADA..."

          );


          procesando = true;


          validarCodigo(
            codigo
          );


        })


        .catch(function(error) {


          mostrarResultado(

            "❌ NO SE ENCONTRÓ UN CÓDIGO QR\n\n" +

            "Asegúrate de que:\n\n" +

            "• El QR aparezca completo.\n" +

            "• La imagen tenga buena calidad.\n" +

            "• El QR esté enfocado."

          );

        });


      // Permitir volver a seleccionar
      // la misma imagen

      event.target.value = "";

    }


    // =================================================
    // MOSTRAR RESULTADO
    // =================================================

    function mostrarResultado(texto) {


      const caja =
        obtenerResultado();


      caja.innerText =
        texto;


      // -----------------------------------------------
      // ACCESO PERMITIDO
      // -----------------------------------------------

      if (

        texto.includes(
          "ACCESO PERMITIDO"
        )

      ) {

        caja.style.background =
          "#064e3b";

      }


      // -----------------------------------------------
      // BLOQUEADO
      // -----------------------------------------------

      else if (

        texto.includes(
          "YA UTILIZADA"
        ) ||

        texto.includes(
          "BLOQUEADA"
        ) ||

        texto.includes(
          "NO VÁLIDO"
        ) ||

        texto.includes(
          "NO VALIDO"
        ) ||

        texto.includes(
          "FINALIZADO"
        ) ||

        texto.includes(
          "NO PERMITIDO"
        ) ||

        texto.includes(
          "BLOQUEADO"
        )

      ) {

        caja.style.background =
          "#7f1d1d";

      }


      // -----------------------------------------------
      // OTRO
      // -----------------------------------------------

      else {

        caja.style.background =
          "#222";

      }

    }


    // =================================================
    // ERRORES DEL LECTOR
    // =================================================

    function errorEscaneo(error) {

      /*
       * No mostramos estos mensajes.
       *
       * html5-qrcode los genera continuamente
       * mientras busca un QR.
       */

    }


  </script>


</body>

</html>
